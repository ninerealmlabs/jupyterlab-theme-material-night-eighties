---
name: Setup
description: |
  Python, Node, uv and optionally the locked Python build toolchain.

  This replaces jupyterlab/maintainer-tools base-setup. That action is itself
  allowlisted, but since v0.34 it calls pnpm/action-setup, and the org's
  allowed-actions policy rejects nested actions it does not list -- the check
  happens when the composite action is loaded, so the `if` guard on the pnpm
  step does not prevent it.

inputs:
  python-version:
    description: Python version to install
    required: false
    default: '3.11'
  node-version:
    description: |
      Node version to install. Must stay >= 24: npm Trusted Publishing needs
      npm >= 11.5.1, which first ships with Node 24.
    required: false
    default: '24'
  release-toolchain:
    description: |
      Sync the locked Python toolchain, including hatch and the build plugins
      needed by jupyter-releaser.
    required: false
    default: 'false'
  dependency-cache:
    description: |
      Restore the uv cache. Set 'false' for release workflows: the cache is
      writable from PR runs, so a PR could influence what gets built and signed.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Install Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        # renovate: datasource=github-releases depName=astral-sh/uv
        version: '0.12.5'
        enable-cache: ${{ inputs.dependency-cache }}
        activate-environment: ${{ inputs.release-toolchain }}

    - name: Install locked Python toolchain
      if: inputs.release-toolchain == 'true'
      shell: bash
      run: |
        set -eux
        uv sync --locked --no-install-project --only-group release
        hatch --version
        jupyter-releaser --help >/dev/null
