---
# runs build steps
name: Build

on: # yamllint disable-line rule:truthy
  # use workflow_dispatch as manual trigger;
  push:
    branches: [main]
  pull_request:
    branches: ['*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  JUPYTERLAB_SPEC: 'jupyterlab>=4.5,<5'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Base Setup
        uses: ./.github/actions/setup

      - name: Install dependencies
        run: uv pip install --system -U "${JUPYTERLAB_SPEC}" "jupyter-builder>=1.0.0,<2"

      - name: Lint the extension
        run: |
          set -eux
          jlpm
          jlpm run lint:check

      - name: Test the extension
        run: |
          set -eux
          jlpm run test

      - name: Build the extension
        run: |
          set -eux
          uv pip install --system .

          jupyter labextension list
          jupyter labextension list 2>&1 | grep -ie "jupyterlab_material_night_eighties.*OK"
          python -m jupyterlab.browser_check

      - name: Package the extension
        run: |
          set -eux

          uv build
          uv pip uninstall --system "jupyterlab_material_night_eighties" jupyterlab

      - name: Upload extension packages
        uses: actions/upload-artifact@v4
        with:
          name: extension-artifacts
          path: dist/jupyterlab_material_night_eighties*
          if-no-files-found: error

  test_isolated:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: 'x64'

      # Deliberately not ./.github/actions/setup -- this job installs no Node,
      # to prove the wheel works without it.
      - name: Install uv
        run: python -m pip install --upgrade uv

      - uses: actions/download-artifact@v4
        with:
          name: extension-artifacts

      - name: Install and Test
        run: |
          set -eux
          # Remove NodeJS, twice to take care of system and locally installed node versions.
          sudo rm -rf $(which node)
          sudo rm -rf $(which node)

          uv pip install --system "${JUPYTERLAB_SPEC}" jupyterlab_material_night_eighties*.whl

          jupyter labextension list
          jupyter labextension list 2>&1 | grep -ie "jupyterlab_material_night_eighties.*OK"
          python -m jupyterlab.browser_check --no-browser-test

  integration-tests:
    name: Integration tests
    needs: build
    runs-on: ubuntu-latest

    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/pw-browsers

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Base Setup
        uses: ./.github/actions/setup

      - name: Download extension package
        uses: actions/download-artifact@v4
        with:
          name: extension-artifacts

      - name: Install the extension
        run: |
          set -eux
          uv pip install --system "${JUPYTERLAB_SPEC}" jupyterlab_material_night_eighties*.whl

      - name: Install dependencies
        working-directory: ui-tests
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: 0
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        run: jlpm install

      # Playwright strips types without checking them, so a broken Galata call
      # would otherwise only surface as a confusing runtime failure.
      - name: Type check the integration tests
        working-directory: ui-tests
        run: jlpm typecheck

      - name: Set up browser cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/pw-browsers
          key: ${{ runner.os }}-${{ hashFiles('ui-tests/yarn.lock') }}

      - name: Install browser
        run: |
          set -eux
          jlpm playwright install chromium --only-shell
        working-directory: ui-tests

      - name: Execute integration tests
        working-directory: ui-tests
        run: |
          jlpm playwright test

      - name: Upload Playwright Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jupyterlab_material_night_eighties-playwright-tests
          path: |
            ui-tests/test-results
            ui-tests/playwright-report

  check_links:
    name: Check Links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: jupyterlab/maintainer-tools/.github/actions/check-links@v1
