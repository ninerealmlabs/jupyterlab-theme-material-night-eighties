---
name: Enforce PR label
on: # yamllint disable-line rule:truthy
  pull_request:
    types: [labeled, unlabeled, opened, edited, synchronize]

permissions: {}

jobs:
  enforce-label:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # the action comments on / labels the PR
    steps:
      - name: enforce-triage-label
        uses: jupyterlab/maintainer-tools/.github/actions/enforce-label@21b1cac622018fd37ec13a1c8081da814e10d94e # v1 (v0.35.0)
