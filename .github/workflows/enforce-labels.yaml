---
name: Enforce PR label
on: # yamllint disable-line rule:truthy
  pull_request:
    types: [labeled, unlabeled, opened, edited, synchronize]

permissions: {}

jobs:
  enforce-label:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # the action comments on / labels the PR
    steps:
      - name: enforce-triage-label
        uses: jupyterlab/maintainer-tools/.github/actions/enforce-label@94b14ddfbdd1ed651e9f9343ae2409ab5c73a6a8 # v1 (v0.35.0)
