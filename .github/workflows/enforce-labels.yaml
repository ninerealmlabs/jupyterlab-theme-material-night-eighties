---
name: Enforce PR label
on: # yamllint disable-line rule:truthy
  pull_request:
    types: [labeled, unlabeled, opened, edited, synchronize]

permissions: {}

jobs:
  enforce-label:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # the action comments on / labels the PR
    steps:
      - name: enforce-triage-label
        uses: jupyterlab/maintainer-tools/.github/actions/enforce-label@b9d5c28489f8b460cef48868f303b97c20f8fe1b # v1.1.2 (v0.35.0)
