---
name: Enforce PR label
on: # yamllint disable-line rule:truthy
  pull_request:
    types: [labeled, unlabeled, opened, edited, synchronize]

permissions: {}

jobs:
  enforce-label:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # the action comments on / labels the PR
    steps:
      - name: enforce-triage-label
        uses: jupyterlab/maintainer-tools/.github/actions/enforce-label@925e40fa6066f4533e0c40803bd4b6d0d2f4a781 # v1.1.0 (v0.35.0)
