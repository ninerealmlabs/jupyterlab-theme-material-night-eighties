---
# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/en/code-security/supply-chain-security/keeping-your-dependencies-updated-automatically/configuration-options-for-dependency-updates

version: 2
updates:
  # Actions are pinned to commit SHAs, so Dependabot is the only thing that
  # moves them. The cooldown gives a compromised release time to be found and
  # yanked before it lands in a PR here.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    ignore:
      # Held back deliberately -- see CONTRIBUTING.md "Pinned dependencies".
      # @jupyterlab/testing pins jest ^29.2.0 and ts-jest ^29.1.0, and it is
      # what backs @jupyterlab/testutils/lib/jest-config.
      - dependency-name: 'jest'
        versions: ['>=30']
      - dependency-name: 'ts-jest'
        versions: ['>=30']
      - dependency-name: '@types/jest'
        versions: ['>=30']
      # typescript-eslint v8 declares `typescript: >=4.8.4 <6.1.0`.
      - dependency-name: 'typescript'
        versions: ['>=6']

  # ui-tests has its own package.json and is not covered by the entry above.
  - package-ecosystem: npm
    directory: /ui-tests
    schedule:
      interval: weekly
    cooldown:
      default-days: 3

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
