---
# Run these hooks with `prek`: https://github.com/j178/prek
# prek reads this file; see https://pre-commit.com/hooks.html for more hooks
ci:
  autoupdate_schedule: monthly

default_install_hook_types:
  - pre-commit
  - commit-msg

default_stages:
  - pre-commit

repos:
  - repo: local
    hooks:
      - id: forbid-yml
        name: Forbid .yml file extensions (use .yaml)
        entry: YAML file extensions must be .yaml
        language: fail
        files: \.yml$
        # Yarn looks for this exact name and has no .yaml fallback; renaming it
        # silently drops nodeLinker and reverts installs to Plug'n'Play.
        exclude: ^\.yarnrc\.yml$
      - id: forbid-co-authored-by-trailer
        name: Require AI-assistant attribution trailer
        language: system
        stages: [commit-msg]
        entry: >-
          bash -c '
            if rg -qi "^Co-authored-by:" "$1"; then
              printf "%s\n" \
                "Commit messages must not include a Co-authored-by trailer." \
                "Use the AI-assistant: trailer instead." >&2
              exit 1
            fi
          ' --
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 'v6.0.0'
    hooks:
      - id: check-added-large-files
        args: [--maxkb=500000]
      - id: check-ast
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: debug-statements
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: forbid-new-submodules
      - id: mixed-line-ending
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: 'v1.5.6'
    hooks:
      - id: remove-crlf
  - repo: https://github.com/sirosen/texthooks
    rev: 0.7.1
    hooks:
      - id: fix-smartquotes
      - id: fix-ligatures
  - repo: https://github.com/gitleaks/gitleaks
    rev: 'v8.30.1'
    hooks:
      - id: gitleaks
  - repo: https://github.com/stefmolin/exif-stripper
    rev: 1.2.0
    hooks:
      - id: strip-exif
        name: Strip exif metadata from images
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.16.5
    hooks:
      - id: commitizen
        language: python
        stages: [commit-msg]
  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: '3.6.1'
    hooks:
      - id: editorconfig-checker
        name: Check editorconfig compliance
        exclude: |
          (?x)^(
            ^(LICENSE)$ |
            ^.*(\.md)$ |
            ^.*(\.rst)$ |
            ^.*(yarn\.lock)$ |
            ^(uv\.lock)$
          )$
  # Format: Markdown
  - repo: https://github.com/hukkin/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        additional_dependencies:
          - mdformat-gfm
          - mdformat-front-matters
          - mdformat-footnote
          - mdformat-gfm-alerts
          - mdformat-toc
          - mdformat-config
          - mdformat-ruff
          - mdformat-simple-breaks
        # jupyter-releaser rewrites CHANGELOG.md around a marker comment and
        # parses it back; reformatting it risks breaking a release.
        exclude: ^CHANGELOG\.md$
  # Lint & Format: Markdown
  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.2.55
    hooks:
      - id: rumdl-fmt
  # Lint & Format: Python
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 'v0.16.3'
    hooks:
      - id: ruff-check
        name: Lint with Ruff
        args: [--fix]
      - id: ruff-format
        name: Format with Ruff
  # Format: shell
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: "v0.11.0.1"
    hooks:
      - id: shellcheck
        name: Lint shell scripts
        exclude: "^.*zsh$" # ignore '*.zsh" scripts'
        stages: [pre-commit]
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: 'v3.13.1-1'
    hooks:
      - id: shfmt
        name: Format shell scripts
        language_version: python3.13
        # `args` replaces the hook's default `[--write]` rather than appending
        # to it, so `--write` must be repeated here; without it shfmt prints to
        # stdout, changes nothing, and always exits 0.
        args:
          - '--write'
          - '--binary-next-line'
          - '--case-indent'
          - '--space-redirects'
          - '--indent'
          - '2'
  # Lint & Format: JS/TS, JSON, CSS
  - repo: https://github.com/biomejs/pre-commit
    rev: v2.5.8
    hooks:
      - id: biome-check
  # Lint: YAML
  - repo: https://github.com/adrienverge/yamllint
    rev: 'v1.38.0'
    hooks:
      - id: yamllint
        name: Lint yaml files
        args: [-c=.yamllint.yaml]
  # NOTE: ".typos.toml" may need to have *already been committed* for the typos
  # hook to read it. If it has not been, comment this block out for one commit.
  - repo: https://github.com/crate-ci/typos
    rev: 'v1.48.0'
    hooks:
      - id: typos
        name: Spellcheck with Typos
        # `args` replaces the hook's default `[--write-changes, --force-exclude]`
        # rather than appending to it. `--force-exclude` is repeated so
        # `.typos.toml`'s exclusions still apply to explicitly-passed files.
        args: ['--force-exclude', '--config', '.typos.toml']
        exclude: |
          (?x)^(
            ^.*(typos\.toml)$ |
            ^.*(\.git.*)$ |
            ^.*(yarn\.lock)$ |
            ^(uv\.lock)$
          )$
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.37.4
    hooks:
      - id: check-github-workflows
      # check-github-workflows does not cover composite actions
      - id: check-github-actions
  # Lint: GitHub Actions security posture. check-jsonschema above only validates
  # shape. Fails the build on unpinned actions and unscoped permissions.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.28.0
    hooks:
      - id: zizmor
