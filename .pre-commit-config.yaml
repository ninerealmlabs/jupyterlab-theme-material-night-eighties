---
ci:
  autoupdate_schedule: monthly

repos:
  - repo: local
    hooks:
      - id: forbid-yml
        name: Forbid .yml file extensions (use .yaml)
        entry: YAML file extensions must be .yaml
        language: fail
        files: \.yml$
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 'v6.0.0'
    hooks:
      - id: end-of-file-fixer
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-added-large-files
        args: [--maxkb=500000]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: forbid-new-submodules
      - id: check-builtin-literals
      - id: mixed-line-ending
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: 'v1.5.6'
    hooks:
      - id: remove-crlf
      - id: remove-tabs
  - repo: https://github.com/sirosen/texthooks
    rev: 0.7.1
    hooks:
      - id: fix-smartquotes
      - id: fix-ligatures
  # Autoformat: YAML, JSON, Markdown, etc.
  # NOTE: pre-commit/mirrors-prettier is archived and never left v3 alpha;
  # rbubley/mirrors-prettier is the maintained successor.
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: 'v3.9.6'
    hooks:
      - id: prettier
        args:
          - --ignore-unknown
  # Lint: Markdown
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        args:
          - --config=.markdownlint.yaml
          - --fix
        exclude: |
          (?x)^(
            CHANGELOG.md
          )$

  # Lint: YAML
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
        args:
          - --config-file=.yamllint.yaml
          - --format=parsable
          - --strict
  # Lint & Format: Python
  # NOTE: charliermarsh/ruff-pre-commit moved to astral-sh/ruff-pre-commit.
  # `ruff-format` replaces black, which is no longer configured in pyproject.toml.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 'v0.16.0'
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.37.4
    hooks:
      - id: check-github-workflows
