[build-system]
requires = ["hatchling>=1.27.0", "hatch-nodejs-version>=0.3.2", "jupyter-builder>=1.0.0,<2"]
build-backend = "hatchling.build"

[project]
name = "jupyterlab_material_night_eighties"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Framework :: Jupyter :: JupyterLab :: 4",
    "Framework :: Jupyter :: JupyterLab :: Extensions",
    "Framework :: Jupyter :: JupyterLab :: Extensions :: Prebuilt",
    "Framework :: Jupyter :: JupyterLab :: Extensions :: Themes",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = []
dynamic = ["version", "description", "authors", "urls", "keywords"]

# --- uv ---------------------------------------------------------------------
# `uv` manages environments and locking; `hatchling` remains the PEP 517 build
# backend because `hatch-jupyter-builder` is a hatchling build hook -- it is what
# runs `jlpm build:prod` and stages the labextension into `share/jupyter`.
# uv has no equivalent hook mechanism, so the two are complementary, not
# alternatives.
#
#   uv sync                 # create .venv with dev tooling
#   uv run jupyter lab      # run against the dev install
#   uv build                # build sdist + wheel (invokes the jupyter-builder hook)
#   uvx hatch version       # read/bump version (jupyter-releaser uses this)
[dependency-groups]
dev = [
    "build>=1.2",
    "hatch>=1.14",
    "jupyter-builder>=1.0.0,<2",
    "jupyterlab>=4.5,<5",
]
release = [
    { include-group = "dev" },
    "editables>=0.3",
    "hatch-jupyter-builder>=0.5",
    "hatch-nodejs-version>=0.3.2",
    "hatchling>=1.27.0",
    # Keep this commit aligned with the jupyter_releaser action pins.
    "jupyter-releaser @ git+https://github.com/jupyter-server/jupyter_releaser@70e58c50c736ad496cca11fe4f2446033b68b027",
]

[tool.uv]
# The labextension build hook shells out to `jlpm`, which needs the JupyterLab
# package present first. Building the project into its own dev env would be
# circular, so keep it a non-installed dev dependency set.
package = false

# --- hatch ------------------------------------------------------------------
[tool.hatch.version]
source = "nodejs"

[tool.hatch.metadata.hooks.nodejs]
fields = ["description", "authors", "urls", "keywords"]

[tool.hatch.build.targets.sdist]
artifacts = ["jupyterlab_material_night_eighties/labextension"]
exclude = [".github", "binder", "screenshots", "scss", "ui-tests"]

[tool.hatch.build.targets.wheel.shared-data]
"jupyterlab_material_night_eighties/labextension" = "share/jupyter/labextensions/@ninerealmlabs/jupyterlab_material_night_eighties"
"install.json" = "share/jupyter/labextensions/@ninerealmlabs/jupyterlab_material_night_eighties/install.json"

[tool.hatch.build.hooks.version]
path = "jupyterlab_material_night_eighties/_version.py"

[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder>=0.5"]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = [
    "jupyterlab_material_night_eighties/labextension/static/style.js",
    "jupyterlab_material_night_eighties/labextension/package.json",
]
skip-if-exists = ["jupyterlab_material_night_eighties/labextension/static/style.js"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
build_cmd = "build:prod"
npm = ["jlpm"]

[tool.hatch.build.hooks.jupyter-builder.editable-build-kwargs]
build_cmd = "install:extension"
npm = ["jlpm"]
source_dir = "src"
build_dir = "jupyterlab_material_night_eighties/labextension"

# --- jupyter-releaser -------------------------------------------------------
[tool.jupyter-releaser.options]
version_cmd = "hatch version"

[tool.jupyter-releaser.hooks]
before-build-npm = [
    "python -m pip install 'jupyter-builder>=1.0.0,<2'",
    "jlpm",
    "jlpm build:prod",
]
before-build-python = ["jlpm clean:all"]

[tool.check-wheel-contents]
ignore = ["W002"]

# --- ruff -------------------------------------------------------------------
# ref: https://docs.astral.sh/ruff/settings/
[tool.ruff]
line-length = 119
target-version = "py310"
src = ["jupyterlab_material_night_eighties"]

[tool.ruff.lint]
select = [
  'A',   # flake8-builtins
  'B',   # flake8-bugbear
  'C4',  # flake8-comprehensions
  'C90', # mccabe
  'E',   # pycodestyle
  'F',   # pyflakes
  'I',   # isort
  'N',   # pep8-naming
  'W',   # pycodestyle
]
ignore = [
  "E501", # line too long -- the formatter handles this
]
unfixable = ["B"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true
force-wrap-aliases = true
known-first-party = ["jupyterlab_material_night_eighties"]

[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.ruff.format]
docstring-code-format = true
